<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hız Testi</title>
<style>
:root{--bg:#f6f8fb;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--card:#fff;--dl:#2563eb;--ul:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--ink:#f1f5f9;--mut:#94a3b8;--line:#1e293b;--card:#111830;--dl:#60a5fa;--ul:#2dd4bf}}
*{box-sizing:border-box;margin:0}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px}
header{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.logo{font-weight:700;letter-spacing:-.3px}
#isp{color:var(--mut)}
main{width:100%;max-width:640px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding-top:30px}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.bg{stroke:var(--line)}
#arc{stroke:var(--dl);transition:stroke-dashoffset .25s linear,stroke .3s}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#live{font-size:clamp(56px,16vw,76px);font-weight:300;letter-spacing:-3px;font-variant-numeric:tabular-nums;line-height:1}
.u{color:var(--mut);font-size:14px;margin-top:8px}
#phase{color:var(--mut);font-size:14px;margin-top:2px;min-height:20px}
#go{margin-top:-14px;border:0;background:var(--ink);color:var(--bg);font:600 16px inherit;font-family:inherit;padding:14px 44px;border-radius:99px;cursor:pointer;transition:opacity .2s,transform .2s}
#go:hover{transform:translateY(-1px)}#go:focus-visible{outline:2px solid var(--dl);outline-offset:3px}
#go:disabled{opacity:.4;cursor:wait}
.stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:18px}
.s{padding:20px 10px;text-align:center}
.s+.s{border-left:1px solid var(--line)}
.s small{color:var(--mut);font-size:13px}
.s b{display:block;font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.s i{font-style:normal;font-size:12px;color:var(--mut);font-weight:400;margin-left:3px}
.meta{width:100%;font-size:14px}
.meta div{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;border-bottom:1px solid var(--line)}
.meta div:last-child{border:0}
.meta span:first-child{color:var(--mut)}
.meta span:last-child{font-weight:500;text-align:right;word-break:break-all}
#loc{background:none;border:0;color:var(--dl);font:inherit;font-weight:500;cursor:pointer;padding:0}
@media(max-width:480px){.s b{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="logo">Hız Testi</div><div id="isp">Bağlanıyor…</div></header>

<main>
  <div>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54"/><circle id="arc" cx="60" cy="60" r="54"/></svg>
      <div class="c"><div id="live">0</div><div class="u">Mbps</div></div>
    </div>
  </div>
  <div style="text-align:center">
    <div id="phase" aria-live="polite">Hazır</div><br>
    <button id="go">Testi başlat</button>
  </div>

  <div class="stats">
    <div class="s"><small>Ping</small><b id="ping">–<i>ms</i></b></div>
    <div class="s"><small>İndirme</small><b id="dlv">–<i>Mbps</i></b></div>
    <div class="s"><small>Yükleme</small><b id="ulv">–<i>Mbps</i></b></div>
  </div>

  <div class="meta">
    <div><span>IP adresi</span><span id="ip">…</span></div>
    <div><span>Şehir</span><span id="city">–</span></div>
    <div><span>Konum</span><span id="pos"><button id="loc">Konumumu paylaş</button></span></div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const C=2*Math.PI*54,arc=$('arc');arc.style.strokeDasharray=C;arc.style.strokeDashoffset=C;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
const frac=v=>Math.min(1,Math.log10(1+v)/Math.log10(1001));
const fmt=v=>v<10?v.toFixed(2):v.toFixed(1);
function gauge(v,col){$('live').textContent=v<10?v.toFixed(1):Math.round(v);arc.style.strokeDashoffset=C*(1-frac(v));if(col)arc.style.stroke=`var(${col})`}
const set=(id,v,u)=>$(id).innerHTML=v+'<i>'+u+'</i>';

/* IP ve konum */
async function loadIP(){
  try{const d=await (await fetch('https://speed.cloudflare.com/meta')).json();
    $('ip').textContent=d.clientIp;$('isp').textContent=d.asOrganization||'Bağlı';
    $('city').textContent=[d.city,d.country].filter(Boolean).join(', ')||'–';window._ip=d;
  }catch(e){try{const d=await (await fetch('https://api.ipify.org?format=json')).json();$('ip').textContent=d.ip;$('isp').textContent='Bağlı'}
    catch(_){$('ip').textContent='Alınamadı';$('isp').textContent='Çevrimdışı'}}
}
function askLoc(){
  if(!navigator.geolocation){$('pos').textContent='Desteklenmiyor';return}
  navigator.geolocation.getCurrentPosition(p=>{$('pos').textContent=p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4)},
  e=>{$('pos').innerHTML='İzin verilmedi · <button id="loc">tekrar dene</button>';$('loc').onclick=askLoc},{enableHighAccuracy:true,timeout:10000});
}
$('loc').onclick=askLoc;

/* Ölçümler */
async function ping(){const t=[];for(let i=0;i<8;i++){const s=performance.now();await fetch('https://speed.cloudflare.com/__down?bytes=0&r='+Math.random(),{cache:'no-store'});t.push(performance.now()-s)}t.shift();return Math.min(...t)}
async function download(ms=9000){
  const start=performance.now();let total=0,last=start;const ctl=new AbortController();
  const w=async()=>{while(performance.now()-start<ms){try{
    const r=await fetch('https://speed.cloudflare.com/__down?bytes=25000000&r='+Math.random(),{cache:'no-store',signal:ctl.signal});const rd=r.body.getReader();
    while(true){const {done,value}=await rd.read();if(done)break;total+=value.length;const n=performance.now();
      if(n-last>250){last=n;const a=total*8/((n-start)/1000)/1e6;gauge(a);set('dlv',fmt(a),'Mbps')}
      if(n-start>ms){ctl.abort();return}}}catch(e){return}}};
  await Promise.all([w(),w(),w(),w()]);return total*8/((performance.now()-start)/1000)/1e6;
}
function upload(ms=8000){return new Promise(res=>{
  const start=performance.now(),blob=new Blob([new Uint8Array(6e6)]),L={};let n=0,done=0,fin=false,last=start;
  const sum=()=>Object.values(L).reduce((a,b)=>a+b,0);
  const finish=()=>{if(fin)return;fin=true;res(sum()*8/((performance.now()-start)/1000)/1e6)};
  const go=()=>{if(performance.now()-start>ms){if(++done>=3)finish();return}
    const id=n++,x=new XMLHttpRequest();x.open('POST','https://speed.cloudflare.com/__up');
    x.upload.onprogress=e=>{L[id]=e.loaded;const now=performance.now();
      if(now-last>250){last=now;const a=sum()*8/((now-start)/1000)/1e6;gauge(a);set('ulv',fmt(a),'Mbps')}
      if(now-start>ms)x.abort()};
    x.onload=x.onerror=x.onabort=go;x.send(blob)};
  go();go();go()})}

$('go').onclick=async()=>{
  const b=$('go');b.disabled=true;
  set('ping','–','ms');set('dlv','–','Mbps');set('ulv','–','Mbps');
  try{
    $('phase').textContent='Ping ölçülüyor…';gauge(0,'--dl');
    const p=await ping();set('ping',Math.round(p),'ms');
    $('phase').textContent='İndirme ölçülüyor…';gauge(0,'--dl');
    const d=await download();gauge(d);set('dlv',fmt(d),'Mbps');
    $('phase').textContent='Yükleme ölçülüyor…';gauge(0,'--ul');
    const u=await upload();gauge(u);set('ulv',fmt(u),'Mbps');
    $('phase').textContent='Tamamlandı';
  }catch(e){$('phase').textContent='Test başarısız, bağlantını kontrol et'}
  b.disabled=false;b.textContent='Tekrar test et';
};
loadIP();askLoc();
</script>
</body>
</html>
