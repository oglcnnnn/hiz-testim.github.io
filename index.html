<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hız Testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e20;--bg2:#161838;--line:rgba(255,255,255,.09);--tx:#f4f5ff;--mut:#8b90b8;--dl:#27e6ff;--ul:#b08cff;--glass:rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color:var(--tx);min-height:100vh;
background:radial-gradient(700px 420px at 50% 22%,#2a2a7a40,transparent 70%),radial-gradient(600px 400px at 100% 100%,#0e7a9a22,transparent 70%),var(--bg);
padding:0 20px 48px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.4px}
.logo svg{width:30px;height:30px}
.net{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:99px}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:#2ee59d;box-shadow:0 0 10px #2ee59d}

.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.r{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;transition:border-color .3s,box-shadow .3s}
.r.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 30px -10px var(--c)}
.r small{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;font-weight:500}
.r small svg{width:15px;height:15px;stroke:var(--c);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.r b{display:block;margin-top:8px;font-size:clamp(24px,5.5vw,34px);font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.r b i{font-style:normal;font-size:12px;font-weight:500;color:var(--mut);margin-left:4px;letter-spacing:0}
.rp{--c:#7cf5a8}.rd{--c:var(--dl)}.ru{--c:var(--ul)}

.gwrap{position:relative;width:min(480px,100%);margin:18px auto 0}
.gwrap>svg{width:100%;display:block;overflow:visible}
.track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:14;stroke-linecap:round}
#arc{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .3s ease-out;filter:drop-shadow(0 0 8px var(--glow,#27e6ff88))}
.tick{stroke:rgba(255,255,255,.22);stroke-width:1.5}.tick.m{stroke:rgba(255,255,255,.6);stroke-width:2}
.lab{fill:var(--mut);font-size:11.5px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
#needle{transform-origin:200px 200px;transition:transform .3s ease-out}
.center{position:absolute;left:50%;top:58.8%;transform:translate(-50%,-50%);text-align:center}
#go{width:128px;height:128px;border-radius:50%;border:2px solid transparent;cursor:pointer;color:var(--dl);font:800 34px "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:1px;
background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(135deg,var(--dl),var(--ul)) border-box;
box-shadow:0 0 40px -6px #27e6ff77;animation:breathe 2.6s ease-in-out infinite;transition:transform .2s}
#go:hover{transform:scale(1.06)}#go:focus-visible{outline:3px solid #fff;outline-offset:5px}
#go small{display:block;font-size:12px;font-weight:600;letter-spacing:0;color:var(--mut);margin-top:2px}
@keyframes breathe{50%{box-shadow:0 0 62px -2px #b08cff88}}
#live{display:none}
#live .ph{font-size:14px;font-weight:600;color:var(--mut)}
#live .n{font-size:clamp(52px,13vw,72px);font-weight:800;letter-spacing:-3px;line-height:1.05;font-variant-numeric:tabular-nums}
#live .u{font-size:14px;color:var(--mut);font-weight:500}
.running #go{display:none}.running #live{display:block}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.card h3{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:10px}
.ip{font-size:26px;font-weight:800;letter-spacing:-.6px;word-break:break-all}
.sub{color:var(--mut);font-size:14px;margin-top:6px;line-height:1.5}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.line:first-of-type{border:0;padding-top:0}
.line span:first-child{color:var(--mut)}.line span:last-child{font-weight:600;text-align:right}
.lb{margin-top:12px;background:var(--glass);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:9px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.lb:hover{border-color:var(--dl)}
@media(max-width:560px){.cards{grid-template-columns:1fr}.r{padding:13px 12px}.center{top:58.8%}#go{width:104px;height:104px;font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#27e6ff"/><stop offset="1" stop-color="#b08cff"/></linearGradient></defs><circle cx="16" cy="16" r="13" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-dasharray="62 20" transform="rotate(130 16 16)" stroke-linecap="round"/><path d="M16 17 22 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      Hız Testi
    </div>
    <div class="net" id="isp">Bağlantı kontrol ediliyor…</div>
  </header>

  <section class="results">
    <div class="r rp" id="cp"><small><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Ping</small><b id="ping">–<i>ms</i></b></div>
    <div class="r rd" id="cd"><small><svg viewBox="0 0 24 24"><path d="M12 4v15m-6-6 6 6 6-6"/></svg>İndirme</small><b id="dlv">–<i>Mbps</i></b></div>
    <div class="r ru" id="cu"><small><svg viewBox="0 0 24 24"><path d="M12 20V5m-6 6 6-6 6 6"/></svg>Yükleme</small><b id="ulv">–<i>Mbps</i></b></div>
  </section>

  <section class="gwrap" id="gw">
    <svg viewBox="0 0 400 340" aria-hidden="true">
      <defs>
        <linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#27e6ff"/><stop offset="1" stop-color="#4f7cff"/></linearGradient>
        <linearGradient id="gu" x1="0" x2="1"><stop offset="0" stop-color="#b08cff"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient>
      </defs>
      <path class="track" d="M93.93 306.07A150 150 0 1 1 306.07 306.07"/>
      <path id="arc" d="M93.93 306.07A150 150 0 1 1 306.07 306.07" stroke="url(#gd)"/>
      <g id="ticks"></g>
      <g id="needle"><path d="M327 200 L343 195 L343 205Z" fill="#fff" opacity=".95"/></g>
    </svg>
    <div class="center">
      <button id="go" aria-label="Testi başlat">GO</button>
      <div id="live"><div class="ph" id="ph">İndirme</div><div class="n" id="n">0</div><div class="u">Mbps</div></div>
    </div>
  </section>

  <section class="cards">
    <div class="card">
      <h3>IP adresin</h3>
      <div class="ip" id="ip">…</div>
      <div class="sub" id="org">Servis sağlayıcı alınıyor</div>
    </div>
    <div class="card">
      <h3>Konumun</h3>
      <div class="line"><span>Şehir</span><span id="city">–</span></div>
      <div class="line"><span>Koordinat</span><span id="pos">İzin bekleniyor</span></div>
      <button class="lb" id="loc">Konumumu paylaş</button>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg',L=706.86;
const frac=v=>Math.min(1,Math.log10(1+v)/Math.log10(1001));
const pt=(f,r)=>{const a=(135+270*f)*Math.PI/180;return[200+r*Math.cos(a),200+r*Math.sin(a)]};
/* ölçek: çentikler ve sayılar */
(()=>{const g=$('ticks'),labs=[0,5,10,25,50,100,250,500,1000];
 for(let i=0;i<=54;i++){const f=i/54,m=i%6===0,[x1,y1]=pt(f,m?122:128),[x2,y2]=pt(f,134);
  const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('class','tick'+(m?' m':''));g.appendChild(l)}
 labs.forEach(v=>{const[x,y]=pt(frac(v),108),t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','lab');t.textContent=v;g.appendChild(t)})})();
$('arc').style.strokeDasharray=L;$('arc').style.strokeDashoffset=L;
function gauge(v,phase){const f=frac(v);$('arc').style.strokeDashoffset=L*(1-f);$('needle').style.transform=`rotate(${135+270*f}deg)`;
 $('n').textContent=v<10?v.toFixed(1):Math.round(v)}
function mode(m){ // dl | ul
 const dl=m==='dl';$('arc').setAttribute('stroke',dl?'url(#gd)':'url(#gu)');$('arc').style.setProperty('--glow',dl?'#27e6ff88':'#b08cffaa');
 $('ph').textContent=dl?'İndirme':'Yükleme';$('cd').classList.toggle('on',dl);$('cu').classList.toggle('on',!dl)}
const fmt=v=>v<10?v.toFixed(2):v.toFixed(1);
const set=(id,v,u)=>$(id).innerHTML=v+'<i>'+u+'</i>';

/* IP + konum */
async function loadIP(){
 try{const d=await(await fetch('https://speed.cloudflare.com/meta')).json();
  $('ip').textContent=d.clientIp;$('org').textContent=d.asOrganization||'Servis sağlayıcı bilinmiyor';
  $('isp').textContent=d.asOrganization||'Bağlı';$('city').textContent=[d.city,d.country].filter(Boolean).join(', ')||'–'}
 catch(e){try{const d=await(await fetch('https://api.ipify.org?format=json')).json();$('ip').textContent=d.ip;$('org').textContent='Servis sağlayıcı alınamadı';$('isp').textContent='Bağlı'}
  catch(_){$('ip').textContent='Alınamadı';$('org').textContent='İnternet bağlantını kontrol et';$('isp').textContent='Çevrimdışı'}}}
function askLoc(){
 if(!navigator.geolocation){$('pos').textContent='Desteklenmiyor';return}
 navigator.geolocation.getCurrentPosition(p=>{$('pos').textContent=p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4)},
  ()=>{$('pos').textContent='İzin verilmedi'},{enableHighAccuracy:true,timeout:10000})}
$('loc').onclick=askLoc;

/* ölçümler */
async function ping(){const t=[];for(let i=0;i<8;i++){const s=performance.now();await fetch('https://speed.cloudflare.com/__down?bytes=0&r='+Math.random(),{cache:'no-store'});t.push(performance.now()-s)}t.shift();return Math.min(...t)}
async function download(ms=9000){
 const start=performance.now();let total=0,last=start;const ctl=new AbortController();
 const w=async()=>{while(performance.now()-start<ms){try{
  const r=await fetch('https://speed.cloudflare.com/__down?bytes=25000000&r='+Math.random(),{cache:'no-store',signal:ctl.signal}),rd=r.body.getReader();
  while(true){const{done,value}=await rd.read();if(done)break;total+=value.length;const n=performance.now();
   if(n-last>200){last=n;const a=total*8/((n-start)/1000)/1e6;gauge(a);set('dlv',fmt(a),'Mbps')}
   if(n-start>ms){ctl.abort();return}}}catch(e){return}}};
 await Promise.all([w(),w(),w(),w()]);return total*8/((performance.now()-start)/1000)/1e6}
function upload(ms=8000){return new Promise(res=>{
 const start=performance.now(),blob=new Blob([new Uint8Array(6e6)]),P={};let n=0,done=0,fin=false,last=start;
 const sum=()=>Object.values(P).reduce((a,b)=>a+b,0);
 const finish=()=>{if(fin)return;fin=true;res(sum()*8/((performance.now()-start)/1000)/1e6)};
 const go=()=>{if(performance.now()-start>ms){if(++done>=3)finish();return}
  const id=n++,x=new XMLHttpRequest();x.open('POST','https://speed.cloudflare.com/__up');
  x.upload.onprogress=e=>{P[id]=e.loaded;const now=performance.now();
   if(now-last>200){last=now;const a=sum()*8/((now-start)/1000)/1e6;gauge(a);set('ulv',fmt(a),'Mbps')}
   if(now-start>ms)x.abort()};
  x.onload=x.onerror=x.onabort=go;x.send(blob)};
 go();go();go()})}

$('go').onclick=async()=>{
 $('gw').classList.add('running');['ping','dlv','ulv'].forEach(i=>set(i,'–',i==='ping'?'ms':'Mbps'));
 try{
  $('cp').classList.add('on');const p=await ping();set('ping',Math.round(p),'ms');$('cp').classList.remove('on');
  mode('dl');gauge(0);const d=await download();gauge(d);set('dlv',fmt(d),'Mbps');
  mode('ul');gauge(0);const u=await upload();gauge(u);set('ulv',fmt(u),'Mbps');
  await new Promise(r=>setTimeout(r,900));
 }catch(e){}
 ['cp','cd','cu'].forEach(i=>$(i).classList.remove('on'));
 gauge(0);$('gw').classList.remove('running');$('go').innerHTML='TEKRAR<small>testi yenile</small>';$('go').style.fontSize='22px';
};
loadIP();askLoc();
</script>
</body>
</html>
